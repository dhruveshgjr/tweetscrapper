<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>X Tweet Scraper</title>
  <style>
    :root {
      --bg: #15202b;
      --card: #1e2d3d;
      --border: #38444d;
      --text: #e7e9ea;
      --muted: #8899a6;
      --accent: #1d9bf0;
      --danger: #f4212e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 420px;
      min-height: 300px;
      max-height: 550px;
      overflow-y: auto;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
    }
    .header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 16px; font-weight: 700; }
    .stats { color: var(--muted); font-size: 12px; }
    .controls {
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .controls input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 8px 14px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }
    .controls input:focus { border-color: var(--accent); }
    .controls button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .controls button:hover { opacity: 0.9; }
    .error {
      margin: 16px;
      padding: 12px;
      background: rgba(244,33,46,0.1);
      border: 1px solid var(--danger);
      border-radius: 8px;
      color: var(--danger);
    }
    .tweet-list { padding: 0; }
    .tweet-card {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: default;
    }
    .tweet-card:hover { background: var(--card); }
    .tweet-meta {
      display: flex;
      gap: 12px;
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }
    .tweet-text { line-height: 1.45; margin-top: 4px; }
    .badge {
      display: inline-block;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
      color: var(--muted);
      margin-left: 4px;
    }
    .loading { text-align: center; padding: 40px; color: var(--muted); }
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 10px;
    }
    .pagination button {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
    .pagination button:hover:not(:disabled) { background: var(--accent); }
    .download-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .download-btn:hover { background: var(--card); }
  </style>
</head>
<body>
  <div class="header">
    <h1>X Tweet Scraper</h1>
    <div>
      <span class="stats" id="stats"></span>
      <button class="download-btn" id="downloadBtn">Download CSV</button>
    </div>
  </div>
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search tweets..." />
    <button id="searchBtn">Search</button>
  </div>
  <div id="content">
    <div class="loading">Connecting to localhost:3000...</div>
  </div>
  <div class="pagination" id="pagination" style="display:none;">
    <button id="prevBtn">Prev</button>
    <span id="pageInfo" style="color:var(--muted);font-size:12px;align-self:center;"></span>
    <button id="nextBtn">Next</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
